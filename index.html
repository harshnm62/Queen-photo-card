<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b0d3a">
<title>Jheel's Birthday Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg1: #3b0d3a;
    --bg2: #7a1e4f;
    --gold: #f5c96a;
    --gold-dark: #c9962e;
    --ink: #2a0a24;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg1); }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 15% 10%, rgba(245, 201, 106, .25) 0 6px, transparent 7px),
      radial-gradient(circle at 85% 18%, rgba(255, 255, 255, .18) 0 4px, transparent 5px),
      radial-gradient(circle at 70% 60%, rgba(245, 201, 106, .18) 0 5px, transparent 6px),
      radial-gradient(circle at 10% 75%, rgba(255, 255, 255, .15) 0 4px, transparent 5px),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 {
    margin: 4px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 8vw, 38px);
    text-align: center;
    color: var(--gold);
    letter-spacing: .5px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .35);
  }
  .sub { margin: -8px 0 0; opacity: .85; font-size: 16px; text-align: center; }

  .stage {
    position: relative;
    /* keep the whole card plus the buttons on one phone screen */
    width: min(100%, 360px, max(200px, calc((100vh - 400px) * 630 / 1020)));
    width: min(100%, 360px, max(200px, calc((100svh - 400px) * 630 / 1020)));
    aspect-ratio: 630 / 1020;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .45), 0 0 0 3px rgba(245, 201, 106, .55);
    overflow: hidden;
    background: #fff;
  }
  #card {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #card.has-photo { cursor: grab; touch-action: none; }
  #card.dragging { cursor: grabbing; }
  .hint {
    position: absolute;
    left: 50%; bottom: 14%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, .55);
    color: #fff;
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .4s;
    opacity: 0;
  }
  .hint.show { opacity: 1; }

  .suits { display: flex; gap: 12px; justify-content: center; }
  .suit {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: 3px solid transparent;
    background: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    transition: transform .15s, border-color .15s;
    padding: 0;
  }
  .suit svg { width: 34px; height: 34px; }
  .suit[aria-pressed="true"] { border-color: var(--gold); transform: scale(1.1); box-shadow: 0 0 0 4px rgba(245, 201, 106, .35), 0 6px 16px rgba(0, 0, 0, .35); }
  .suit:active { transform: scale(.95); }

  .themes { display: flex; gap: 8px; width: min(100%, 380px); background: rgba(0, 0, 0, .22); padding: 5px; border-radius: 18px; }
  .theme {
    flex: 1; min-height: 50px; border: 0; border-radius: 14px; cursor: pointer;
    background: transparent; color: #fff; font: 700 16px/1 inherit; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px;
    transition: background .15s, color .15s;
  }
  .theme .ico { font-size: 20px; display: inline-grid; place-items: center; width: 24px; height: 24px; }
  .theme .ico svg { width: 24px; height: 24px; }
  .theme[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
  .zoom { display: none; width: min(100%, 360px); align-items: center; gap: 10px; font-size: 20px; }
  .zoom.show { display: flex; }
  .zoom input { flex: 1; accent-color: var(--gold); height: 32px; }

  .buttons { display: flex; flex-direction: column; gap: 12px; width: min(100%, 360px); }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 16px;
    min-height: 60px;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .1s, filter .15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.primary { background: linear-gradient(180deg, var(--gold), var(--gold-dark)); color: var(--ink); box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
  .btn.secondary { background: rgba(255, 255, 255, .14); color: #fff; border: 2px solid rgba(255, 255, 255, .35); }
  .btn.big { min-height: 68px; font-size: 20px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  label.btn { user-select: none; -webkit-user-select: none; }
  .hidden { display: none !important; }
  footer { opacity: .6; font-size: 13px; margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>👑 Queen of Hearts</h1>
  <p class="sub">Jheel's Birthday 2026 🎉</p>

  <div class="themes" role="group" aria-label="Pick a card style">
    <button class="theme" data-theme="queen" aria-pressed="true"><span class="ico">👑</span>Queen</button>
    <button class="theme" data-theme="seahorse" aria-pressed="false"><span class="ico"></span>Seahorse</button>
    <button class="theme" data-theme="libra" aria-pressed="false"><span class="ico"></span>Libra</button>
  </div>

  <div class="stage">
    <canvas id="card" width="630" height="1020" aria-label="Your card preview"></canvas>
    <div class="hint" id="hint">Drag to move · pinch to zoom</div>
  </div>

  <div class="zoom" id="zoomRow">
    <span aria-hidden="true">−</span>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <span aria-hidden="true">+</span>
  </div>

  <div class="buttons">
    <div class="row">
      <label class="btn primary big" id="takeBtn" for="cameraInput" role="button">📸 Take photo</label>
      <label class="btn secondary big" id="pickBtn" for="fileInput" role="button">🖼️ Photos</label>
    </div>
    <div class="row hidden" id="exportRow">
      <button class="btn primary" id="downloadBtn">⬇️ Download card</button>
      <button class="btn secondary hidden" id="shareBtn">📤 Share</button>
    </div>
  </div>

  <div class="suits" role="group" aria-label="Pick a suit">
    <button class="suit" data-suit="hearts" aria-pressed="true" aria-label="Hearts"></button>
    <button class="suit" data-suit="diamonds" aria-pressed="false" aria-label="Diamonds"></button>
    <button class="suit" data-suit="clubs" aria-pressed="false" aria-label="Clubs"></button>
    <button class="suit" data-suit="spades" aria-pressed="false" aria-label="Spades"></button>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <input type="file" id="fileInput" accept="image/*">

  <footer>Prints as 2.1 × 3.4 in · made with love 💛</footer>
</main>

<script>
(() => {
  const W = 630, H = 1020;
  const INNER = { x: 30, y: 30, w: 570, h: 960, r: 26 };
  const TAB = { w: 122, h: 214, r: 26 };
  const COLORS = { red: '#c8102e', black: '#161616' };
  const SUITS = {
    hearts:   { color: COLORS.red,   name: 'Hearts' },
    diamonds: { color: COLORS.red,   name: 'Diamonds' },
    clubs:    { color: COLORS.black, name: 'Clubs' },
    spades:   { color: COLORS.black, name: 'Spades' },
  };

  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const zoomRow = document.getElementById('zoomRow');
  const zoomInput = document.getElementById('zoom');
  const exportRow = document.getElementById('exportRow');
  const shareBtn = document.getElementById('shareBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const title = document.querySelector('h1');

  let suit = 'hearts';
  let photo = null;            // canvas holding the (possibly downscaled) photo
  let baseScale = 1;           // scale that makes the photo exactly cover INNER
  let zoom = 1;                // user zoom on top of baseScale
  let ox = 0, oy = 0;          // photo center offset from INNER center, in card px

  // ---------- suit shapes (unit box centered at 0,0, size 1) ----------
  function suitPath(p, s) {
    if (s === 'hearts') {
      p.moveTo(0, 0.42);
      p.bezierCurveTo(-0.08, 0.32, -0.5, 0.06, -0.5, -0.17);
      p.bezierCurveTo(-0.5, -0.4, -0.3, -0.5, -0.17, -0.5);
      p.bezierCurveTo(-0.07, -0.5, 0, -0.42, 0, -0.32);
      p.bezierCurveTo(0, -0.42, 0.07, -0.5, 0.17, -0.5);
      p.bezierCurveTo(0.3, -0.5, 0.5, -0.4, 0.5, -0.17);
      p.bezierCurveTo(0.5, 0.06, 0.08, 0.32, 0, 0.42);
      p.closePath();
    } else if (s === 'diamonds') {
      p.moveTo(0, -0.5);
      p.quadraticCurveTo(0.17, -0.2, 0.38, 0);
      p.quadraticCurveTo(0.17, 0.2, 0, 0.5);
      p.quadraticCurveTo(-0.17, 0.2, -0.38, 0);
      p.quadraticCurveTo(-0.17, -0.2, 0, -0.5);
      p.closePath();
    } else if (s === 'spades') {
      p.moveTo(0, -0.5);
      p.bezierCurveTo(-0.1, -0.36, -0.5, -0.12, -0.5, 0.1);
      p.bezierCurveTo(-0.5, 0.3, -0.33, 0.38, -0.2, 0.38);
      p.bezierCurveTo(-0.1, 0.38, -0.04, 0.33, -0.03, 0.29);
      p.quadraticCurveTo(-0.06, 0.42, -0.16, 0.5);
      p.lineTo(0.16, 0.5);
      p.quadraticCurveTo(0.06, 0.42, 0.03, 0.29);
      p.bezierCurveTo(0.04, 0.33, 0.1, 0.38, 0.2, 0.38);
      p.bezierCurveTo(0.33, 0.38, 0.5, 0.3, 0.5, 0.1);
      p.bezierCurveTo(0.5, -0.12, 0.1, -0.36, 0, -0.5);
      p.closePath();
    } else { // clubs
      const r = 0.2;
      circle(p, 0, -0.27, r);
      circle(p, -0.26, 0.08, r);
      circle(p, 0.26, 0.08, r);
      circle(p, 0, 0.02, 0.14);
      p.moveTo(-0.04, 0.05);
      p.quadraticCurveTo(-0.05, 0.38, -0.17, 0.5);
      p.lineTo(0.17, 0.5);
      p.quadraticCurveTo(0.05, 0.38, 0.04, 0.05);
      p.closePath();
    }
  }
  function circle(p, x, y, r) { p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2); p.closePath(); }

  function drawSuit(c, s, cx, cy, size, color) {
    c.save();
    c.translate(cx, cy);
    c.scale(size, size);
    c.beginPath();
    suitPath(c, s);
    c.fillStyle = color;
    c.fill('nonzero');
    c.restore();
  }

  // Suit icons for the picker buttons (SVG built from the same shapes via a tiny recorder)
  function suitSVG(s) {
    let d = '';
    const f = (n) => (Math.round((n + 0.5) * 1000) / 10).toFixed(1);
    const rec = {
      moveTo: (x, y) => d += `M${f(x)} ${f(y)}`,
      lineTo: (x, y) => d += `L${f(x)} ${f(y)}`,
      quadraticCurveTo: (a, b, x, y) => d += `Q${f(a)} ${f(b)} ${f(x)} ${f(y)}`,
      bezierCurveTo: (a, b, c2, e, x, y) => d += `C${f(a)} ${f(b)} ${f(c2)} ${f(e)} ${f(x)} ${f(y)}`,
      arc: (x, y, r) => { const R = r * 100; d += `M${f(x - r)} ${f(y)}a${R} ${R} 0 1 0 ${2 * R} 0a${R} ${R} 0 1 0 ${-2 * R} 0`; },
      closePath: () => d += 'Z',
    };
    // circle() calls moveTo before arc; the arc recorder restarts the subpath itself, so that's harmless
    suitPath(rec, s);
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="${SUITS[s].color}" d="${d}"/></svg>`;
  }

  // ---------- geometry helpers ----------
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function clampOffsets() {
    if (!photo) return;
    const dw = photo.width * baseScale * zoom;
    const dh = photo.height * baseScale * zoom;
    const mx = Math.max(0, (dw - INNER.w) / 2);
    const my = Math.max(0, (dh - INNER.h) / 2);
    ox = Math.min(mx, Math.max(-mx, ox));
    oy = Math.min(my, Math.max(-my, oy));
  }

  // ---------- seahorse + libra artwork (SVG paths in a 100x100 box) ----------
  const SEAHORSE_BODY = new Path2D('M14 18.5L28 16C30 8 40 3 50 7C57 10 60 18 56 26C54 29 54 31 56 33C66 40 68 54 62 66C60 72 58 78 55 82C50 80 44 74 40 66C36 58 37 48 42 42C44 38 44 34 40 31C36 28 32 27 28 26L14 25.5C11 25.5 11 18.5 14 18.5Z' +
    'M42 6L44 0L47 6ZM48 7L52 2L53 9ZM63 46C73 46 75 58 65 61Z');
  const SEAHORSE_TAIL = new Path2D('M57 78C58 88 54 96 46 96C39 96 37 89 42 87C45 86 47 89 45 91');
  const SEAHORSE_RIDGES = new Path2D('M43 47Q52 49 61 45M41 55Q52 57 63 53M42 63Q52 65 62 62M46 71Q52 73 59 71M66 50L70 51M66 55L70 56');
  const LIBRA = new Path2D('M15 80L85 80M15 64L33 64C22 52 30 27 50 27C70 27 78 52 67 64L85 64');

  // x,y = top-left of the 100x100 box, k = scale (1 = 100px)
  function drawSeahorse(c, x, y, k, color, bg, detail = true) {
    c.save();
    c.translate(x, y);
    c.scale(k, k);
    c.fillStyle = color;
    c.fill(SEAHORSE_BODY);
    c.strokeStyle = color;
    c.lineWidth = 6;
    c.lineCap = 'round';
    c.stroke(SEAHORSE_TAIL);
    if (detail) {
      c.globalAlpha = 0.45;
      c.strokeStyle = bg;
      c.lineWidth = 1.6;
      c.stroke(SEAHORSE_RIDGES);
      c.globalAlpha = 1;
      c.fillStyle = bg;
      c.beginPath();
      c.arc(44, 13, 2.4, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }
  function drawLibra(c, x, y, k, color) {
    c.save();
    c.translate(x, y);
    c.scale(k, k);
    c.strokeStyle = color;
    c.lineWidth = 7;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.stroke(LIBRA);
    c.restore();
  }
  function drawSparkle(c, cx, cy, r, color) {
    c.save();
    c.translate(cx, cy);
    c.beginPath();
    c.moveTo(0, -r);
    c.quadraticCurveTo(0, 0, r, 0);
    c.quadraticCurveTo(0, 0, 0, r);
    c.quadraticCurveTo(0, 0, -r, 0);
    c.quadraticCurveTo(0, 0, 0, -r);
    c.fillStyle = color;
    c.fill();
    c.restore();
  }

  const SEA = { light: '#14a3a8', dark: '#0a4f7a', coral: '#ff8a6b' };
  const NIGHT = { light: '#4a2c6e', dark: '#1f1747', gold: '#f5c96a' };

  const THEMES = {
    queen: {
      title: () => '👑 Queen of ' + SUITS[suit].name,
      file: () => 'queen-of-' + suit,
      accent: () => SUITS[suit].color,
      border: () => '#fff',
      placeholder: ['#fbe3ec', '#f7d58f'],
      bigIcon(c) { drawSuit(c, suit, W / 2, H / 2 - 60, 260, SUITS[suit].color + '33'); },
      tab(c) {
        const color = SUITS[suit].color;
        c.fillStyle = color;
        c.textAlign = 'center';
        c.textBaseline = 'alphabetic';
        c.font = 'bold 88px Georgia, "Times New Roman", Times, serif';
        c.fillText('Q', TAB_CX, 106);
        drawSuit(c, suit, TAB_CX, 170, 54, color);
      },
      decorate() {},
      caption: { bg: '#fff', fg: () => SUITS[suit].color, icon: (c, x, y, h) => drawSuit(c, suit, x + h / 2, y, h, SUITS[suit].color) },
    },
    seahorse: {
      title: () => '🌊 Seahorse Card',
      file: () => 'seahorse-card',
      accent: () => '#ffffff',
      border: (c) => { const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, SEA.light); g.addColorStop(1, SEA.dark); return g; },
      placeholder: ['#c9f1ef', '#86cde3'],
      bigIcon(c) { drawSeahorse(c, W / 2 - 150, H / 2 - 230, 3, SEA.dark + '30', '#000', false); },
      tab(c) {
        drawSeahorse(c, 20, 52, 1.3, SEA.coral, SEA.light);
        c.strokeStyle = 'rgba(255,255,255,.8)';
        c.lineWidth = 2.5;
        [[100, 46, 6], [109, 30, 4], [96, 22, 3]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); });
      },
      decorate(c) {
        // little bubbles floating in the border
        c.strokeStyle = 'rgba(255,255,255,.65)';
        c.lineWidth = 2;
        borderSpots(23).forEach(([x, y], i) => { c.beginPath(); c.arc(x, y, 3 + (i * 7 % 4), 0, Math.PI * 2); c.stroke(); });
      },
      caption: { bg: '#fff', fg: () => SEA.dark, icon: (c, x, y, h) => drawSeahorse(c, x - h * 0.12, y - h / 2, h / 100, SEA.coral, '#fff', false) },
    },
    libra: {
      title: () => '✨ Libra Card',
      file: () => 'libra-card',
      accent: () => NIGHT.gold,
      border: (c) => { const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, NIGHT.light); g.addColorStop(1, NIGHT.dark); return g; },
      placeholder: ['#e4dcfa', '#f6e2b3'],
      bigIcon(c) { drawLibra(c, W / 2 - 150, H / 2 - 260, 3, NIGHT.light + '40'); },
      tab(c) {
        drawLibra(c, TAB_CX - 50 * 1.1, 22, 1.1, NIGHT.gold);
        drawSparkle(c, TAB_CX, 158, 20, NIGHT.gold);
        drawSparkle(c, TAB_CX + 26, 132, 8, NIGHT.gold);
      },
      decorate(c) {
        borderSpots(29).forEach(([x, y], i) => drawSparkle(c, x, y, 4 + (i * 5 % 4), 'rgba(245,201,106,.85)'));
      },
      caption: { bg: NIGHT.dark, fg: () => NIGHT.gold, icon: (c, x, y, h) => drawLibra(c, x - h * 0.15, y - h * 0.55, h / 100 * 1.1, NIGHT.gold) },
    },
  };
  let theme = 'queen';
  const TAB_CX = 30 + (TAB.w - 30) / 2 + 2;
  const CAPTION = "Jheel's Birthday 2026";

  // evenly spaced points along the middle of the border, skipping the two corner tabs
  function borderSpots(n) {
    const m = 15, pts = [];
    const per = 2 * (W - 2 * m) + 2 * (H - 2 * m);
    for (let i = 0; i < n; i++) {
      let d = (i + 0.5) * per / n;
      let x, y;
      if (d < W - 2 * m) { x = m + d; y = m; }
      else if ((d -= W - 2 * m) < H - 2 * m) { x = W - m; y = m + d; }
      else if ((d -= H - 2 * m) < W - 2 * m) { x = W - m - d; y = H - m; }
      else { d -= W - 2 * m; x = m; y = H - m - d; }
      const inTab = (x < TAB.w + 10 && y < TAB.h + 10) || (x > W - TAB.w - 10 && y > H - TAB.h - 10);
      if (!inTab) pts.push([x, y]);
    }
    return pts;
  }

  // ---------- rendering ----------
  function drawPlaceholder(c) {
    const t = THEMES[theme];
    const g = c.createLinearGradient(INNER.x, INNER.y, INNER.x + INNER.w, INNER.y + INNER.h);
    g.addColorStop(0, t.placeholder[0]);
    g.addColorStop(1, t.placeholder[1]);
    c.fillStyle = g;
    c.fillRect(INNER.x, INNER.y, INNER.w, INNER.h);
    t.bigIcon(c);
    c.fillStyle = '#4a1840';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = '600 38px -apple-system, "Segoe UI", Roboto, sans-serif';
    c.fillText('Tap to add', W / 2, H / 2 + 110);
    c.fillText('your photo', W / 2, H / 2 + 158);
    c.font = '72px sans-serif';
    c.fillText('📸', W / 2, H / 2 + 248);
  }

  function tabPath(c) {
    c.moveTo(0, 0);
    c.lineTo(TAB.w, 0);
    c.lineTo(TAB.w, TAB.h - TAB.r);
    c.arcTo(TAB.w, TAB.h, TAB.w - TAB.r, TAB.h, TAB.r);
    c.lineTo(0, TAB.h);
    c.closePath();
  }

  function drawCaption(c) {
    const cap = THEMES[theme].caption;
    const h = 54, icon = 30, gap = 10, pad = 22;
    c.font = 'italic 600 29px Georgia, "Times New Roman", Times, serif';
    const tw = c.measureText(CAPTION).width;
    const w = pad * 2 + icon + gap + tw;
    // centre in the space left of the bottom-right corner tab
    const cx = (INNER.x + (W - TAB.w)) / 2;
    const cy = INNER.y + INNER.h - 46;
    const x = cx - w / 2;
    c.save();
    c.shadowColor = 'rgba(0,0,0,.28)';
    c.shadowBlur = 10;
    c.shadowOffsetY = 3;
    roundRectPath(c, x, cy - h / 2, w, h, h / 2);
    c.fillStyle = cap.bg;
    c.fill();
    c.restore();
    cap.icon(c, x + pad, cy, icon);
    c.fillStyle = cap.fg();
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillText(CAPTION, x + pad + icon + gap, cy + 1);
  }

  function render() {
    const c = ctx;
    const t = THEMES[theme];
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = t.border(c);
    c.fillRect(0, 0, W, H);
    t.decorate(c);

    // photo window: rounded inner rect minus the two corner tabs
    c.save();
    roundRectPath(c, INNER.x, INNER.y, INNER.w, INNER.h, INNER.r);
    c.clip();
    c.beginPath();
    c.rect(0, 0, W, H);
    tabPath(c);
    c.save();
    c.translate(W, H);
    c.rotate(Math.PI);
    tabPath(c);
    c.restore();
    c.clip('evenodd');
    if (photo) {
      const s = baseScale * zoom;
      const dw = photo.width * s, dh = photo.height * s;
      const cx = INNER.x + INNER.w / 2 + ox;
      const cy = INNER.y + INNER.h / 2 + oy;
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'high';
      c.drawImage(photo, cx - dw / 2, cy - dh / 2, dw, dh);
    } else {
      drawPlaceholder(c);
    }
    c.restore();

    // corner art: top-left, then bottom-right rotated 180°
    t.tab(c);
    c.save();
    c.translate(W, H);
    c.rotate(Math.PI);
    t.tab(c);
    c.restore();

    drawCaption(c);

    // thin decorative rule around the card
    roundRectPath(c, 13, 13, W - 26, H - 26, 30);
    c.lineWidth = 3;
    c.strokeStyle = t.accent();
    c.stroke();
    c.restore();
  }

  function refreshTitle() { title.textContent = THEMES[theme].title(); }

  // ---------- theme picker ----------
  const suitRow = document.querySelector('.suits');
  const themeBtns = [...document.querySelectorAll('.theme')];
  const iconSVG = {
    seahorse: `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="${SEA.coral}" d="M14 18.5L28 16C30 8 40 3 50 7C57 10 60 18 56 26C54 29 54 31 56 33C66 40 68 54 62 66C60 72 58 78 55 82C50 80 44 74 40 66C36 58 37 48 42 42C44 38 44 34 40 31C36 28 32 27 28 26L14 25.5C11 25.5 11 18.5 14 18.5ZM42 6L44 0L47 6ZM48 7L52 2L53 9ZM63 46C73 46 75 58 65 61Z"/><path fill="none" stroke="${SEA.coral}" stroke-width="7" stroke-linecap="round" d="M57 78C58 88 54 96 46 96C39 96 37 89 42 87C45 86 47 89 45 91"/></svg>`,
    libra: `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="none" stroke="${NIGHT.gold}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M15 80L85 80M15 64L33 64C22 52 30 27 50 27C70 27 78 52 67 64L85 64"/></svg>`,
  };
  themeBtns.forEach((b) => {
    const svg = iconSVG[b.dataset.theme];
    if (svg) b.querySelector('.ico').innerHTML = svg;
    b.addEventListener('click', () => {
      theme = b.dataset.theme;
      themeBtns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      suitRow.classList.toggle('hidden', theme !== 'queen');
      refreshTitle();
      render();
    });
  });

  // ---------- suit picker ----------
  const suitBtns = [...document.querySelectorAll('.suit')];
  suitBtns.forEach((b) => {
    b.innerHTML = suitSVG(b.dataset.suit);
    b.addEventListener('click', () => {
      suit = b.dataset.suit;
      suitBtns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      refreshTitle();
      render();
    });
  });

  // ---------- photo input ----------
  const cameraInput = document.getElementById('cameraInput');
  const fileInput = document.getElementById('fileInput');
  [cameraInput, fileInput].forEach((inp) => inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    inp.value = '';
    if (f) loadFile(f);
  }));

  function loadFile(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      // Downscale huge camera photos once so dragging stays smooth (still >2x print resolution).
      const MAX = 2600;
      const k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const pc = document.createElement('canvas');
      pc.width = Math.max(1, Math.round(img.naturalWidth * k));
      pc.height = Math.max(1, Math.round(img.naturalHeight * k));
      const p = pc.getContext('2d');
      p.imageSmoothingQuality = 'high';
      p.drawImage(img, 0, 0, pc.width, pc.height);
      photo = pc;
      baseScale = Math.max(INNER.w / pc.width, INNER.h / pc.height);
      zoom = 1; ox = 0; oy = 0;
      zoomInput.value = '1';
      canvas.classList.add('has-photo');
      zoomRow.classList.add('show');
      exportRow.classList.remove('hidden');
      setTimeout(() => exportRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
      document.getElementById('takeBtn').innerHTML = '📸 Retake';
      render();
      hint.classList.add('show');
      clearTimeout(loadFile.t);
      loadFile.t = setTimeout(() => hint.classList.remove('show'), 3500);
    };
    img.onerror = () => { URL.revokeObjectURL(url); alert("Sorry, that photo couldn't be opened. Try another one."); };
    img.src = url;
  }

  // ---------- drag / pinch ----------
  const pointers = new Map();
  let lastPinch = null;
  let moved = false;

  function toCard(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  function zoomAt(newZoom, px, py) {
    newZoom = Math.min(4, Math.max(1, newZoom));
    const f = newZoom / zoom;
    const icx = INNER.x + INNER.w / 2, icy = INNER.y + INNER.h / 2;
    ox = (icx + ox - px) * f + px - icx;
    oy = (icy + oy - py) * f + py - icy;
    zoom = newZoom;
    zoomInput.value = String(zoom);
    clampOffsets();
    render();
  }

  function pinchState() {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!photo) return;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, toCard(e));
    moved = false;
    canvas.classList.add('dragging');
    if (pointers.size === 2) lastPinch = pinchState();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const cur = toCard(e);
    pointers.set(e.pointerId, cur);
    if (pointers.size === 1) {
      ox += cur.x - prev.x;
      oy += cur.y - prev.y;
      if (Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y) > 1) moved = true;
      clampOffsets();
      render();
    } else if (pointers.size === 2 && lastPinch) {
      const p = pinchState();
      ox += p.x - lastPinch.x;
      oy += p.y - lastPinch.y;
      moved = true;
      zoomAt(zoom * (p.d / Math.max(1, lastPinch.d)), p.x, p.y);
      lastPinch = p;
    }
    if (moved) hint.classList.remove('show');
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastPinch = pointers.size === 2 ? pinchState() : null;
    if (pointers.size === 0) canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('click', () => { if (!photo) fileInput.click(); });

  canvas.addEventListener('wheel', (e) => {
    if (!photo) return;
    e.preventDefault();
    const p = toCard(e);
    zoomAt(zoom * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
  }, { passive: false });

  zoomInput.addEventListener('input', () => {
    zoomAt(parseFloat(zoomInput.value), INNER.x + INNER.w / 2, INNER.y + INNER.h / 2);
  });

  // iOS Safari: stop the page from rubber-banding while pinching the card
  canvas.addEventListener('touchmove', (e) => { if (photo) e.preventDefault(); }, { passive: false });

  // ---------- export ----------
  function getBlob() {
    render();
    return new Promise((res) => canvas.toBlob(res, 'image/png'));
  }
  function fileName() { return 'jheel-2026-' + THEMES[theme].file() + '.png'; }

  downloadBtn.addEventListener('click', async () => {
    const blob = await getBlob();
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  });

  const canShareFiles = (() => {
    try {
      return !!(navigator.share && navigator.canShare &&
        navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] }));
    } catch (_) { return false; }
  })();
  if (canShareFiles) shareBtn.classList.remove('hidden');

  shareBtn.addEventListener('click', async () => {
    const blob = await getBlob();
    if (!blob) return;
    const file = new File([blob], fileName(), { type: 'image/png' });
    try {
      await navigator.share({ files: [file], title: "My card from Jheel's birthday" });
    } catch (err) {
      if (err && err.name !== 'AbortError') downloadBtn.click();
    }
  });

  // Draw once fonts are ready so the Q uses the serif face
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
